<div class="layout">
  <header class="topbar">
    <a class="brand" routerLink="/" (click)="cerrarMenu()">COMUNIX</a>

    <button
      class="menu-btn"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuAbierto()"
      aria-label="Abrir menú"
    >
      <span></span><span></span><span></span>
    </button>

    <nav class="nav" [class.abierto]="menuAbierto()">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="cerrarMenu()">Inicio</a>
      <a routerLink="/radicar" routerLinkActive="active" (click)="cerrarMenu()">Radicar PQRS</a>
      <a routerLink="/consultar" routerLinkActive="active" (click)="cerrarMenu()">Consultar estado</a>
      <a routerLink="/publicaciones" routerLinkActive="active" (click)="cerrarMenu()">Publicaciones</a>
      <a routerLink="/encuestas" routerLinkActive="active" (click)="cerrarMenu()">Encuestas</a>
      <a routerLink="/registro" routerLinkActive="active" (click)="cerrarMenu()">Registrarse</a>
      <a class="acceso" routerLink="/login" (click)="cerrarMenu()">Iniciar sesión</a>
    </nav>
  </header>

  <main class="content">
    <router-outlet />
  </main>

  <footer class="footer">
    Junta de Acción Comunal · Vereda Potrerito
  </footer>
</div>
